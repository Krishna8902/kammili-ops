name: kammili-ops
on:
  schedule:
    - cron: '*/30 6-22 * * *'   # every 30 min, 06:00-22:00 UTC
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pipeline
        env:
          OWNERREZ_USER: ${{ secrets.OWNERREZ_USER }}
          OWNERREZ_TOKEN: ${{ secrets.OWNERREZ_TOKEN }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GCAL_ICAL_URL: ${{ secrets.GCAL_ICAL_URL }}
        run: |
          python fetch/check_window.py || exit 0
          for f in fetch/*.py; do [ "$(basename "$f")" = "check_window.py" ] && continue; python "$f"; done
          python build.py
          python render.py
          python brief.py
      - name: Publish board
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kammili-ops   # TODO: replace with your actual Cloudflare Pages project name
          directory: out
