name: kammili-ops
on:
  schedule:
    # Every 2 hours from 07:00 through 21:00 UTC. In winter that is 7am–9pm
    # UK. In summer the same UTC slots are 8am–10pm BST; the London gate
    # below drops 22:00 BST, so the last summer run is 8pm UK. Together
    # with fetch/check_window.py this stays inside 7am–10pm London.
    - cron: '0 7-21/2 * * *'
  workflow_dispatch: {}
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Operating window
        id: window
        run: |
          set +e
          python fetch/check_window.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside operating window. Pipeline skipped."
          else
            exit "$code"
          fi

      - name: Run pipeline
        if: steps.window.outputs.run == 'true'
        env:
          OWNERREZ_USER: ${{ secrets.OWNERREZ_USER }}
          OWNERREZ_TOKEN: ${{ secrets.OWNERREZ_TOKEN }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          MAINTENANCE_SHEET_CSV: ${{ secrets.MAINTENANCE_SHEET_CSV }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TURNO_TOKEN: ${{ secrets.TURNO_TOKEN }}
          TURNO_PARTNER_ID: ${{ secrets.TURNO_PARTNER_ID }}
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt
          for f in fetch/*.py; do
            case "$(basename "$f")" in
              check_window.py) continue ;;
            esac
            python "$f"
          done
          python build.py
          python render.py
          python brief.py

      - name: Upload dashboard
        if: steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ops-dashboard
          path: out/index.html
          retention-days: 5
          if-no-files-found: error

      # The site is behind Cloudflare Access. Git builds are turned off first
      # so a push cannot publish the raw repo (no index.html, no OwnerRez
      # secrets). Wrangler then uploads the out/ directory this job built.
      - name: Stop Git builds from overwriting the site
        if: steps.window.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/cloudflare_pages.py

      - name: Deploy to Cloudflare Pages
        if: steps.window.outputs.run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=kammili-ops --branch=main --commit-dirty=true
